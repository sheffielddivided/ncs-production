# Engangstest (DEPLOY_HOST = navnet i FTP-sertifikatet): kan GitHub Actions nå energy.kbak.no over FTPS med
# DEPLOY_*-secretene? Kjører bare ved push til testgrenen og endrer ingenting
# på serveren utover en testfil som slettes igjen.
name: Test FTP-tilgang

on:
  push:
    branches: [claude/youthful-volta-agjubj]
    paths: [.github/workflows/test-ftp.yml]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
      PASS: ${{ secrets.DEPLOY_PASSWORD }}
      DIR:  ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Sjekk at secretene finnes
        run: |
          for v in HOST USER PASS DIR; do
            if [ -z "${!v}" ]; then echo "::error::$v mangler"; exit 1; fi
            echo "$v er satt"
          done

      - name: Nettverk – svarer port 21?
        run: |
          timeout 10 bash -c "echo > /dev/tcp/$HOST/21" && echo "Port 21 åpen" \
            || { echo "::error::Får ikke kontakt med $HOST:21"; exit 1; }

      - name: Hvilket navn gjelder FTP-sertifikatet for?
        run: |
          echo | timeout 15 openssl s_client -starttls ftp -connect "$HOST:21" -servername "$HOST" 2>/dev/null \
            | openssl x509 -noout -subject -issuer -enddate -ext subjectAltName \
            | sed 's#/#|#g'   # DEPLOY_PATH=/ maskeres i loggen, så / byttes ut

      - name: FTPS – logg inn, list, skriv og slett testfil
        run: |
          echo "ok $(date -u +%FT%TZ)" > ftp-test.txt
          T=".ftp-test-${GITHUB_RUN_ID}.txt"
          lftp -u "$USER","$PASS" "$HOST" <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:timeout 15
          set net:max-retries 1
          cd "$DIR"
          cls -l index.html .htaccess data
          put ftp-test.txt -o "$T"
          cls -l "$T"
          rm "$T"
          LFTP
          echo "INNLOGGING, LISTING, SKRIVING OG SLETTING OK"
