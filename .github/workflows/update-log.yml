name: Oppdater oppdateringsloggen

# data/update_log.json til updates.html: hva som er endret i dataene, dag
# for dag. I tillegg data/update_details/<dato>.json med hva endringene er
# (faktasetninger per kilde), som grunnlag for en daglig oppsummering. Bygges fra git-historikken (build_update_log.py regner de siste
# tre dagene på nytt) når en av oppdateringsworkflowene er ferdig, og én gang
# før midnatt UTC, så endringer gjort i appen også kommer med. Egen jobb, så
# datajobbene aldri skriver samme fil og kommer i konflikt.
on:
  workflow_run:
    workflows:
      - Oppdater SODIR-data
      - Oppdater tankskip (dypgang)
      - Oppdater selskapsnyheter
      - Oppdater normpris-data
      - Oppdater Canada (C-NLOER)
      - Oppdater US Gulf of Mexico (BOEM)
      - Oppdater Brasil (ANP)
      - Oppdater Angola (ANPG)
    types: [completed]
  schedule:
    - cron: '52 23 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Bygg hele loggen og detaljfilene på nytt for så mange dager (0 = vanlig kjøring)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: update-log
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Full historikk ved backfill, ellers holder 300 commits (tre dager).
          fetch-depth: ${{ fromJSON(inputs.backfill || '0') > 0 && '0' || '300' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bygg loggen
        env:
          BACKFILL: ${{ inputs.backfill || '0' }}
        run: |
          if [ "$BACKFILL" -gt 0 ] 2>/dev/null; then
            python build_update_log.py --backfill "$BACKFILL"
          else
            python build_update_log.py
          fi

      - name: Commit hvis loggen er endret
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/update_log.json data/update_details
          if git diff --staged --quiet; then
            echo "Ingen endringer - hopper over commit."
            exit 0
          fi
          git commit -m "Oppdater oppdateringsloggen ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
