name: Sett passord for Valuation BETA

# Leser passordet fra secreten BETA_PASSWORD og skriver en saltet
# PBKDF2-SHA256-hash av det til data/beta_gate.json. Appen sjekker det
# inntastede passordet mot hashen, så selve passordet finnes bare i secreten.
#
# Secrets utløser ingen hendelse når de endres: kjør denne for hånd
# (Actions → «Sett passord for Valuation BETA» → Run workflow) etter at
# BETA_PASSWORD er opprettet eller endret. Hver kjøring lager nytt salt, så
# alle må taste passordet på nytt.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-password
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Skriv hash av passordet
        env:
          BETA_PASSWORD: ${{ secrets.BETA_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, sys
          pw = os.environ.get('BETA_PASSWORD', '')
          if not pw:
              sys.exit('Secreten BETA_PASSWORD mangler eller er tom.')
          salt = os.urandom(16)
          it = 600_000
          h = hashlib.pbkdf2_hmac('sha256', pw.encode('utf-8'), salt, it, 32)
          out = {'alg': 'PBKDF2-SHA256', 'iter': it,
                 'salt': base64.b64encode(salt).decode(), 'hash': base64.b64encode(h).decode()}
          with open('data/beta_gate.json', 'w') as f:
              json.dump(out, f, indent=1)
              f.write('\n')
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beta_gate.json
          git commit -m "Nytt passord for Valuation BETA"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
