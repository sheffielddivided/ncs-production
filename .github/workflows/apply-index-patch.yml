# Engangs-workflow: kobler index.html til datafilene under data/.
#
# Endringen gjøres her, på runneren, i stedet for å pushe hele index.html,
# fordi fila inneholder en 13 KB base64-kodet favicon. Runneren har de
# eksakte bytene fra repoet og rører aldri den linja.
#
# patch_index.py sletter seg selv i samme commit. Selve denne workflow-fila
# må fjernes utenfra, siden GITHUB_TOKEN ikke har lov til å endre filer
# under .github/workflows/.

name: Koble index.html til datafilene (engangs)

on:
  push:
    branches: [claude/sodir-data-pipeline]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch index.html
        run: python patch_index.py

      - name: Verifiser at favicon-linja er urørt
        run: |
          git diff --unified=0 -- index.html | grep -q '^[-+].*apple-touch-icon' \
            && { echo 'FEIL: favicon-linja ble endret'; exit 1; } \
            || echo 'OK - favicon urørt'

      - name: Commit og fjern engangsscriptet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q patch_index.py
          git add index.html
          if git diff --staged --quiet; then
            echo "Ingenting å gjøre."
          else
            git commit -m "Koble index.html til statiske SODIR-datafiler"
            git push
          fi
