name: Oppdater UKCS-selskapsfakta

# Selskapsfakta til UKCS → Company (fetch_uk_companies.py): juridiske enheter
# fra NSTAs lisensdata, profil og eiere fra Companies House (via proxyen i
# sheffielddivided/convert), LEI og øverste morselskap fra GLEIF, og brønnbaner
# per ansvarlig konsern. Endrer seg sjelden, så én gang i uka holder.
on:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uk-companies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer avhengigheter
        run: pip install requests

      - name: Hent selskapsfakta
        run: python fetch_uk_companies.py

      - name: Commit hvis dataene er endret
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ukcs_companies.json
          if git diff --staged --quiet; then
            echo "Ingen endringer - hopper over commit."
            exit 0
          fi
          git commit -m "Oppdater UKCS-selskapsfakta ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
