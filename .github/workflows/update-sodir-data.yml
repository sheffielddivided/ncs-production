name: Oppdater SODIR-data

on:
  schedule:
    # 04:15 UTC hver dag. Sodir publiserer nye produksjonstall månedlig,
    # så de fleste kjøringene vil ikke gi noen commit.
    - cron: '15 4 * * *'
  workflow_dispatch:

# Trengs for at jobben skal kunne pushe de oppdaterte datafilene.
permissions:
  contents: write

concurrency:
  group: sodir-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer avhengigheter
        run: pip install requests openpyxl

      - name: Hent data fra Sodir
        run: python fetch_sodir.py

      # Daglig Brent spotpris fra EIA til skjøten av Datert Brent i Prices.
      # Uten nøkkel, eller hvis EIA ikke svarer, brukes FRED (samme serie).
      - name: Hent Brent spotpris (EIA)
        continue-on-error: true
        timeout-minutes: 5
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_eia.py

      # Månedlige gasspriser (SSB eksportpris, IMF Europa, Henry Hub, Norges
      # Bank-kurser) til Gas-fanen i Prices.
      - name: Hent gasspriser
        continue-on-error: true
        timeout-minutes: 5
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_gas.py

      # Konsumprisindekser (USD, EUR, NOK) til realprisvisningen i Prices.
      - name: Hent konsumprisindekser
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_cpi.py

      # Årlige prisbaner fra 1970 (Brent og europeisk gass fra Verdensbanken,
      # USD/NOK og amerikansk KPI fra FRED) til kontantstrømmen i hubprofilen.
      - name: Hent prisbaner (Verdensbanken, FRED)
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_price_history.py

      # Siste produksjonsmeldinger fra Sodirs RSS-feed, lenket fra NCS → Production.
      - name: Hent produksjonsmeldinger (Sodir RSS)
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_news.py

      # Prospektnavn til letebrønner (spesielt tørre) fra Sodirs RSS-feed for
      # boreresultater. Arkivet i data/exploration_prospects.json bare vokser.
      - name: Hent prospektnavn (Sodir RSS)
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_prospects.py

      # Tilsynssaker fra Havtil (RSS, første listeside og saksider), koblet
      # til felt for sakslista i feltprofilen. Arkivet i data/havtil.json bare
      # vokser. Sakssidene leses innenfor et tidsbudsjett på 7 minutter.
      - name: Hent tilsynssaker (Havtil)
        continue-on-error: true
        timeout-minutes: 10
        run: python fetch_havtil.py

      # Nedetid per felt fra Gasscos hendelser (UMM), i dager med tapt
      # produksjon per måned, fra januar 2025. Hendelsene lagres i arkivet
      # data/gassco_events.json, som bare vokser; daglig leses Gasscos arkiv
      # 120 dager bakover. Etter Sodir, som gir siste produksjonsmåned.
      - name: Hent nedetid (Gassco UMM)
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_gassco.py

      # Sodirs pressemeldinger (boretillatelser, boreresultater, generelle
      # nyheter) til Companies → News. Etter Havtil, så felt- og
      # selskapsdataene er oppdatert. Selskapenes egne feeder hentes av
      # update-company-news.yml, som eier data/company_news.json alene.
      - name: Hent Sodirs pressemeldinger (RSS)
        continue-on-error: true
        timeout-minutes: 10
        run: python fetch_company_news.py --sodir

      # Danske felt til DCS-seksjonen: leser de publiserte JSON-filene fra
      # ENS-løsningen (sheffielddivided/ens), som selv henter fra
      # Energistyrelsen. Feiler steget eller har ENS endret formatet, beholdes
      # forrige data/dcs*.json og resten committes likevel.
      - name: Hent danske data (ENS)
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_ens.py

      # Nøkkeltall fra SSB (sysselsetting og investeringer) til Economy-fanen.
      # Feiler SSB, beholdes forrige fil og Sodir-dataene committes likevel.
      - name: Hent nøkkeltall fra SSB
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_ssb.py

      # Riggposisjoner fra Kystverkets åpne AIS-data. Kilden er av og til
      # overbelastet, og et mislykket steg her skal ikke hindre at Sodir-dataene
      # committes. Historikken hentes i biter og fortsetter neste kjøring.
      - name: Hent riggposisjoner (AIS)
        continue-on-error: true
        timeout-minutes: 30
        run: python fetch_rigs.py

      - name: Commit hvis dataene er endret
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Ingen endringer - hopper over commit."
          else
            git commit -m "Oppdater SODIR-data ($(date -u +%Y-%m-%d))"
            # Selskapsnyhetsjobben kan ha pushet i mellomtiden (andre filer).
            git pull --rebase origin main
            git push
          fi
