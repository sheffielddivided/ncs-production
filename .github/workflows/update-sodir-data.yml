name: Oppdater SODIR-data

on:
  schedule:
    # 04:15 UTC hver dag. Sodir publiserer nye produksjonstall månedlig,
    # så de fleste kjøringene vil ikke gi noen commit.
    - cron: '15 4 * * *'
  workflow_dispatch:

# Trengs for at jobben skal kunne pushe de oppdaterte datafilene.
permissions:
  contents: write

concurrency:
  group: sodir-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer avhengigheter
        run: pip install requests

      - name: Hent data fra Sodir
        run: python fetch_sodir.py

      # Daglig Brent spotpris fra EIA til skjøten av Datert Brent i Prices.
      # Uten nøkkel, eller hvis EIA ikke svarer, brukes FRED (samme serie).
      - name: Hent Brent spotpris (EIA)
        continue-on-error: true
        timeout-minutes: 5
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_eia.py

      # Månedlige gasspriser (SSB eksportpris, IMF Europa, Henry Hub, Norges
      # Bank-kurser) til Gas-fanen i Prices.
      - name: Hent gasspriser
        continue-on-error: true
        timeout-minutes: 5
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python fetch_gas.py

      # Konsumprisindekser (USD, EUR, NOK) til realprisvisningen i Prices.
      - name: Hent konsumprisindekser
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_cpi.py

      # Siste produksjonsmeldinger fra Sodirs RSS-feed, lenket fra NCS → Production.
      - name: Hent produksjonsmeldinger (Sodir RSS)
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_news.py

      # Tilsynssaker fra Havtil (RSS, første listeside og saksider), koblet
      # til felt for sakslista i feltprofilen. Arkivet i data/havtil.json bare
      # vokser. Sakssidene leses innenfor et tidsbudsjett på 7 minutter.
      - name: Hent tilsynssaker (Havtil)
        continue-on-error: true
        timeout-minutes: 10
        run: python fetch_havtil.py

      # Nøkkeltall fra SSB (sysselsetting og investeringer) til Economy-fanen.
      # Feiler SSB, beholdes forrige fil og Sodir-dataene committes likevel.
      - name: Hent nøkkeltall fra SSB
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_ssb.py

      # Riggposisjoner fra Kystverkets åpne AIS-data. Kilden er av og til
      # overbelastet, og et mislykket steg her skal ikke hindre at Sodir-dataene
      # committes. Historikken hentes i biter og fortsetter neste kjøring.
      - name: Hent riggposisjoner (AIS)
        continue-on-error: true
        timeout-minutes: 30
        run: python fetch_rigs.py

      - name: Commit hvis dataene er endret
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Ingen endringer - hopper over commit."
          else
            git commit -m "Oppdater SODIR-data ($(date -u +%Y-%m-%d))"
            git push
          fi
